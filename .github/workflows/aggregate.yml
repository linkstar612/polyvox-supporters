name: aggregate-supporters

# Rebuild manifest.json's goal totals + supporter wall. Three triggers:
#   repository_dispatch — the Ko-fi doorman Worker, seconds after a donation
#   schedule            — catches Stripe, which nothing pushes to us
#   workflow_dispatch   — the "run it now" button
#
# Cron is best-effort on the free tier (often 10-45 min late), which is fine
# for a goal bar; the Ko-fi path does not wait on it.
on:
  repository_dispatch:
    types: [kofi-donation]
  schedule:
    - cron: "17,47 * * * *" # ~2x/hour, off :00/:30 to dodge the scheduler herd
  workflow_dispatch: {}

permissions:
  contents: write

# Queue rather than cancel — a cancelled dispatch run is a donation silently
# dropped. This narrows the race but does NOT close it: a queued run can begin,
# and check out main, while the run ahead of it is still finishing its push.
# Measured that happening with three seconds to spare, so the push step below
# is what actually guarantees no donation is lost.
concurrency:
  group: aggregate
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Append, rebuild, commit and push as one retryable unit.
      #
      # A rejected push used to end the run, and with it that run's ledger
      # append. Observed 2026-07-28: two dispatches seconds apart, the second
      # checked out main three seconds before the first pushed, and its work was
      # discarded. Harmless there — both carried the same donation, deduped by
      # `id` — but two DIFFERENT donations that close together would lose the
      # second one outright, and nothing would retry it: the doorman already
      # answered Ko-fi 200, so Ko-fi considers it delivered.
      #
      # Recompute rather than rebase. Replaying this run's commit would publish a
      # manifest built from a ledger that never saw the other donation, which is
      # a wrong total rather than a failed push. Both scripts are idempotent —
      # ledger-append dedupes on `id`, aggregate rebuilds wholesale — so redoing
      # the work on the winner's tip is always safe and always correct.
      - name: Rebuild and publish
        env:
          STRIPE_RESTRICTED_KEY: ${{ secrets.STRIPE_RESTRICTED_KEY }}
          # The CN rail. Both are needed or neither is used; aggregate.mjs
          # prints a skip notice and every other rail still publishes.
          AFDIAN_USER_ID: ${{ secrets.AFDIAN_USER_ID }}
          AFDIAN_TOKEN: ${{ secrets.AFDIAN_TOKEN }}
          # R-DON.6: reads the opt-in tester roster from the license mint. Same
          # value as the Worker's ADMIN_TOKEN secret. Unset leaves
          # manifest.testers exactly as the last good run wrote it.
          MINT_ADMIN_TOKEN: ${{ secrets.MINT_ADMIN_TOKEN }}
          IS_DISPATCH: ${{ github.event_name == 'repository_dispatch' }}
          LEDGER_ENTRY: ${{ toJSON(github.event.client_payload) }}
        run: |
          git config user.name "supporters-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            if [ "$IS_DISPATCH" = "true" ]; then node ledger-append.mjs; fi
            node aggregate.mjs

            git add manifest.json ledger.json wall-pending.json
            if git diff --cached --quiet; then
              echo "Nothing changed — already published by another run."
              exit 0
            fi
            git commit -q -m "chore: refresh supporter goals + wall"
            if git push; then exit 0; fi

            echo "Push rejected (attempt $attempt): another run published first. Rebuilding on its tip."
            git fetch -q origin main
            git reset -q --hard origin/main
          done

          echo "::error::Could not publish after 5 attempts — a donation may be unrecorded."
          exit 1
